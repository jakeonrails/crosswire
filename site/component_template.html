<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--INJECT:TITLE--></title>
<link rel="stylesheet" href="../../assets/crosswire-ui.css">
<style>
  :root {
    --shell-max: 56rem;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cw-color-bg);
    color: var(--cw-color-fg);
    font-family: var(--cw-font-sans);
    line-height: var(--cw-leading-normal);
  }
  header.page {
    border-bottom: var(--cw-border-width) solid var(--cw-color-border);
    padding: var(--cw-space-4) var(--cw-space-5);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--cw-space-4);
    flex-wrap: wrap;
  }
  header.page a.back { color: var(--cw-color-fg-muted); text-decoration: none; font-size: var(--cw-text-sm); }
  header.page a.back:hover { color: var(--cw-color-accent); }
  h1 { font-size: var(--cw-text-2xl); margin: 0; }
  h1 code { font-family: var(--cw-font-mono); }
  p.description { color: var(--cw-color-fg-muted); max-width: var(--shell-max); margin: var(--cw-space-2) var(--cw-space-5) 0; }
  main { max-width: var(--shell-max); margin: 0 auto; padding: var(--cw-space-5); }
  h2 { font-size: var(--cw-text-lg); margin: var(--cw-space-6) 0 var(--cw-space-2); }
  .example { border: var(--cw-border-width) solid var(--cw-color-border); border-radius: var(--cw-radius-lg); margin-bottom: var(--cw-space-4); overflow: hidden; }
  .example > .stage { padding: var(--cw-space-5); background: var(--cw-color-surface-raised); display: flex; flex-wrap: wrap; align-items: center; gap: var(--cw-space-3); }
  .example > .source { border-top: var(--cw-border-width) solid var(--cw-color-border); background: var(--cw-color-surface-sunk); }
  .example > .source > .name { font-family: var(--cw-font-mono); font-size: var(--cw-text-xs); color: var(--cw-color-fg-subtle); padding: var(--cw-space-1) var(--cw-space-3) 0; }
  pre { margin: 0; padding: var(--cw-space-3); overflow-x: auto; font-family: var(--cw-font-mono); font-size: var(--cw-text-xs); }
  table.props { border-collapse: collapse; width: 100%; font-size: var(--cw-text-sm); }
  table.props th, table.props td { text-align: left; padding: var(--cw-space-2) var(--cw-space-3); border-bottom: var(--cw-border-width) solid var(--cw-color-border); }
  table.props th { color: var(--cw-color-fg-muted); font-weight: var(--cw-weight-medium); font-size: var(--cw-text-xs); text-transform: uppercase; letter-spacing: .04em; }
  .eject { background: var(--cw-color-surface-sunk); border: var(--cw-border-width) solid var(--cw-color-border); border-radius: var(--cw-radius-md); padding: var(--cw-space-3); }
  .panel {
    display: flex; flex-wrap: wrap; gap: var(--cw-space-4); align-items: center;
    border: var(--cw-border-width) solid var(--cw-color-border); border-radius: var(--cw-radius-md);
    padding: var(--cw-space-3) var(--cw-space-4); margin: 0 var(--cw-space-5); background: var(--cw-color-surface);
  }
  .panel label { display: flex; flex-direction: column; gap: var(--cw-space-1); font-size: var(--cw-text-xs); color: var(--cw-color-fg-muted); }
  footer.page { padding: var(--cw-space-6) var(--cw-space-5); color: var(--cw-color-fg-subtle); font-size: var(--cw-text-xs); }
</style>
</head>
<body>
  <header class="page">
    <div>
      <a class="back" href="../../index.html">← crosswire</a>
      <h1>cw.<code><!--INJECT:NAME--></code></h1>
    </div>
    <!-- Theme switcher: writes data-cw-theme, the canonical token — see tokens.css's
         own header on why data-cw-theme wins over the bridged data-theme. -->
    <div role="group" aria-label="Theme">
      <button type="button" class="cw-button" data-cw-theme-choice="light">Light</button>
      <button type="button" class="cw-button" data-cw-theme-choice="dark">Dark</button>
      <button type="button" class="cw-button" data-cw-theme-choice="system">System</button>
    </div>
  </header>

  <p class="description"><!--INJECT:DESCRIPTION--></p>

  <!-- Live token panel: every input sets a :root inline custom property directly —
       no JS framework, no build step, just CSSOM. -->
  <div class="panel">
    <label>Accent
      <input type="color" id="cw-live-accent" value="#4f46e5">
    </label>
    <label>Radius
      <input type="range" id="cw-live-radius" min="0" max="24" step="1" value="8">
    </label>
    <label>Font scale
      <input type="range" id="cw-live-font-scale" min="80" max="130" step="5" value="100">
    </label>
  </div>

  <main>
    <h2>Examples</h2>
    <!--INJECT:EXAMPLES-->

    <h2>Props</h2>
    <!--INJECT:PROPS-->

    <h2>Morph contract</h2>
    <pre><code><!--INJECT:MORPH--></code></pre>

    <h2>CSS</h2>
    <pre><code><!--INJECT:CSS--></code></pre>

    <h2>Own the code</h2>
    <p class="eject"><code><!--INJECT:EJECT--></code></p>
  </main>

  <footer class="page">
    Rendered from the gem's real source at build time — nothing on this page is a mock.
    See <code>docs/MORPH.md</code> and <code>site/registry.json</code>.
  </footer>

  <script>
    (function () {
      "use strict";

      var root = document.documentElement;

      // ---- theme switcher --------------------------------------------------------
      document.querySelectorAll("[data-cw-theme-choice]").forEach(function (button) {
        button.addEventListener("click", function () {
          var choice = button.getAttribute("data-cw-theme-choice");
          if (choice === "system") {
            root.removeAttribute("data-cw-theme");
          } else {
            root.setAttribute("data-cw-theme", choice);
          }
        });
      });

      // ---- live token panel -------------------------------------------------------
      var accent = document.getElementById("cw-live-accent");
      accent.addEventListener("input", function () {
        root.style.setProperty("--cw-color-accent", accent.value);
      });

      var radius = document.getElementById("cw-live-radius");
      radius.addEventListener("input", function () {
        root.style.setProperty("--cw-radius", radius.value + "px");
      });

      var fontScale = document.getElementById("cw-live-font-scale");
      fontScale.addEventListener("input", function () {
        var scale = Number(fontScale.value) / 100;
        root.style.setProperty("--cw-text-sm", (0.875 * scale).toFixed(4) + "rem");
        root.style.setProperty("--cw-text-base", (1 * scale).toFixed(4) + "rem");
        root.style.setProperty("--cw-text-lg", (1.125 * scale).toFixed(4) + "rem");
      });
    })();
  </script>
</body>
</html>
